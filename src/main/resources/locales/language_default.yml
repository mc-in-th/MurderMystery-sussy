      Header: "<shadow:#000000FF><#5A4E7C>[</shadow><#FF7518>Haunted Bus<shadow:#000000FF><#5A4E7C>]</shadow> <#F4F1DE>รายชื่อห้องเกม <shadow:#000000FF><#5A4E7C>(</shadow><#B8B0C8>ชื่อ สถานะ ผู้เล่น<shadow:#000000FF><#5A4E7C>)</shadow>"
