#    You can translate MurderMystery messages here.
#             Color codes (&) supported.
#
#             Use \n to make new line
#             Some messages like item
#        descriptions don't support new lines
# they are wrapped every 40 characters automatically
#
#     Some messages support their own placeholders
#            like %player%, %kit% etc.

#
# Color scheme
#
Color:
  Placeholder:
    Value: "&#FFB703"
    Number: "&#FF7518"
    Player: "&#C77DFF"
    Other: "&#FFB703"
  Chat:
    Issue: "&#FF3B47"
    Messages: "&#B8B0C8"
    Special-Char:
      Contains: "■,▸"
      Before: "&#5A4E7C"


#
# Command messages
#
Commands:
  Did-You-Mean: "%plugin_prefix% คุณหมายถึง /%value% หรือไม่?"
  Command-Executed: "%plugin_prefix% ดำเนินการคำสั่งสำเร็จแล้ว"
  Teleported-To-Lobby: "%plugin_prefix% วาร์ปกลับไปยังล็อบบี้แล้ว"
  Removed-Game-Instance: "%color_chat_issue%%plugin_prefix% ลบห้องเกมสำเร็จแล้ว"
  No-Arena-Like-That: "%color_chat_issue%%plugin_prefix% ไม่พบห้องเกมที่ใช้รหัสนี้"
  Look-At-Sign: "%color_chat_issue%%plugin_prefix% กรุณามองที่ป้ายเพื่อใช้คำสั่งนี้"
  Type-Arena-Name: "%color_chat_issue%%plugin_prefix% กรุณาระบุรหัสห้องเกม"
  Hold-Any-Item: "%color_chat_issue%%plugin_prefix% กรุณาถือไอเทมในมือก่อนใช้คำสั่ง"
  No-Free-Arenas: "%color_chat_issue%%plugin_prefix% ขณะนี้ไม่มีห้องเกมที่ว่างอยู่"
  Only-By-Player: "%color_chat_issue%%plugin_prefix% คำสั่งนี้ใช้ได้เฉพาะผู้เล่นในเกมเท่านั้น"
  Not-Playing: "%color_chat_issue%%plugin_prefix% คุณต้องอยู่ในห้องเกมจึงจะใช้คำสั่งนี้ได้"
  No-Permission: "%color_chat_issue%%plugin_prefix% คุณไม่มีสิทธิ์ใช้งานคำสั่งนี้"
  Player-Not-Found: "%color_chat_issue%%plugin_prefix% ไม่พบผู้เล่น %player%"
  Invalid-Location-Teleport: "%color_chat_issue%%plugin_prefix% ตำแหน่งสำหรับวาร์ปไม่ถูกต้อง"
  Wrong-Usage: "%color_chat_issue%%plugin_prefix% รูปแบบคำสั่งไม่ถูกต้อง ใช้: %value%"
  Admin:
    Adjust-Statistic: "%plugin_prefix% ค่าสถิติ %value% ของ %player% เปลี่ยนเป็น %number% แล้ว"
    Reload-Success: "%plugin_prefix% รีโหลดข้อมูลห้องเกมเรียบร้อยแล้ว"
    List:
      Header: "<#5A4E7C>[<#FF7518>Event<#5A4E7C>] <#F4F1DE>รายชื่อห้องเกม <#5A4E7C>(<#B8B0C8>ชื่อ สถานะ ผู้เล่น<#5A4E7C>)"
      Format: "<#FFB703>%arena_name% <#5A4E7C>| %arena_state_placeholder% <#5A4E7C>| <#72EFDD>%arena_players_size%<#5A4E7C>/<#72EFDD>%arena_max_players%"
      No-Arenas: "%color_chat_issue%%plugin_prefix% ยังไม่มีห้องเกมที่สร้างไว้"
    Spychat:
      Toggled: "%plugin_prefix% เปลี่ยนสถานะแชทผู้ดูแลเป็น %value%"
  Main:
    Header: "<#5A4E7C>----------------[<#FF7518> คำสั่ง Event <#5A4E7C>]----------------"
    Description:
      - "<#FFB703>คำสั่งผู้เล่น:"
      - "<#72EFDD>/%plugin_short_command% stats <#5A4E7C>- <#F4F1DE>ดูสถิติการเล่นของคุณ"
      - "<#72EFDD>/%plugin_short_command% leave <#5A4E7C>- <#F4F1DE>ออกจากห้องเกมปัจจุบัน"
      - "<#72EFDD>/%plugin_short_command% join <arena> <#5A4E7C>- <#F4F1DE>เข้าร่วมห้องเกมที่ระบุ"
      - "<#72EFDD>/%plugin_short_command% top <statistic> <#5A4E7C>- <#F4F1DE>ดู 10 อันดับผู้เล่นสูงสุด"
      - "<#72EFDD>/%plugin_short_command% randomjoin <#5A4E7C>- <#F4F1DE>สุ่มเข้าร่วมห้องเกมที่ว่าง"
    Admin-Bonus-Description: "<#FF7518>/%plugin_short_command%a <#5A4E7C>- <#F4F1DE>ดูคำสั่งสำหรับผู้ดูแลระบบทั้งหมด"
    Footer: "<#5A4E7C>--------------------------------------------------"


#
# In-Game scoreboard messages
#
# Please do not use more chars than the scoreboard can handle!
# Scoreboard supports up to 122 chars for 1.14+ and 48 chars for 1.13- (COLOR CODES INCLUDED.)
# Placeholders:
# https://wiki.plugily.xyz/REPLACEWITHPROJECTNAME/placeholders/language
Scoreboard:
  Title: "<#5A4E7C>[<#FF7518>Event<#5A4E7C>]"
  Roles:
    Detective: "<#72EFDD>นักสืบ"
    Murderer: "<#FF3B47>ฆาตกร"
    Innocent: "<#FFB703>ผู้โดยสาร"
    Dead: "<#5A4E7C>เสียชีวิต"
  Detective:
    Alive: "<#6EEB83>ยังมีชีวิต"
    Bow:
      Dropped: "%color_chat_issue%ธนูตกอยู่"
      Picked: "<#FFB703>มีผู้เก็บธนูแล้ว"
  Content:
    Waiting:
      - "<#5A4E7C>----------------"
      - "<#F4F1DE>ด่าน: <#FF7518>%arena_name%"
      - "<#F4F1DE>สถานะ: <#5A4E7C>[<#FFB703>รอผู้เล่น<#5A4E7C>]"
      - ""
      - "<#F4F1DE>ผู้เล่น: <#72EFDD>%arena_players_size%<#5A4E7C>/<#72EFDD>%arena_max_players% คน"
      - "<#F4F1DE>ขั้นต่ำ: <#FFB703>%arena_min_players% คน"
      - "<#5A4E7C>----------------"
    Starting:
      - "<#5A4E7C>----------------"
      - "<#F4F1DE>ด่าน: <#FF7518>%arena_name%"
      - "<#F4F1DE>สถานะ: <#5A4E7C>[<#6EEB83>กำลังจะเริ่ม<#5A4E7C>]"
      - ""
      - "<#F4F1DE>เริ่มใน: <#FFB703>%arena_time%"
      - "<#F4F1DE>ผู้เล่น: <#72EFDD>%arena_players_size%<#5A4E7C>/<#72EFDD>%arena_max_players% คน"
      - "<#5A4E7C>----------------"
    # Contents of scoreboard while ingame
    In-Game:
      - "<#5A4E7C>----------------"
      - "<#F4F1DE>บทบาท: %arena_player_role%"
      - "<#F4F1DE>เวลา: <#FFB703>%arena_time%"
      - "<#F4F1DE>ผู้รอดชีวิต: <#72EFDD>%arena_innocent_size% คน"
      - "<#5A4E7C>----------------"
    In-Game-Murderer:
      - "<#5A4E7C>----------------"
      - "<#F4F1DE>บทบาท: %arena_player_role%"
      - "<#F4F1DE>เวลา: <#FFB703>%arena_time%"
      - "<#F4F1DE>ผู้รอดชีวิต: <#72EFDD>%arena_innocent_size% คน"
      - "<#5A4E7C>----------------"
    # Contents of scoreboard while state is ending
    Ending:
      - "<#5A4E7C>----------------"
      - "<#F4F1DE>สถานะ: <#5A4E7C>[<#FFB703>จบเกมแล้ว<#5A4E7C>]"
      - "<#F4F1DE>ฆาตกร: <#FF3B47>%arena_murderer_list%"
      - "<#5A4E7C>----------------"
    # Contents of scoreboard while state is restarting
    Restarting:
      - "<#5A4E7C>----------------"
      - "<#F4F1DE>ด่าน: <#FF7518>%arena_name%"
      - "<#F4F1DE>สถานะ: <#5A4E7C>[<#FF3B47>กำลังรีเซ็ต<#5A4E7C>]"
      - ""
      - "<#B8B0C8>กำลังเตรียมสนามประลองใหม่"
      - "<#5A4E7C>----------------"

#
# Bossbar messages
#
# Bossbar needs to be enabled on config.yml
Bossbar:
  Title: "<#5A4E7C>[<#FF7518>Event<#5A4E7C>]"
  Content:
    Waiting:
      - "<#5A4E7C>[<#FF7518>Event<#5A4E7C>] <#B8B0C8>กำลังรอผู้โดยสารเพิ่มเติม"
    Starting:
      - "<#5A4E7C>[<#FF7518>Event<#5A4E7C>] <#F4F1DE>เกมกำลังจะเริ่มใน <#FFB703>%arena_time% วิ"
    In-Game:
      - "<#5A4E7C>[<#FF7518>Event<#5A4E7C>] <#F4F1DE>บทบาทของคุณ %arena_player_role%"
    Ending:
      - "<#5A4E7C>[<#FF7518>Event<#5A4E7C>] <#FFB703>เกมจบลงแล้ว"
    Restarting:
      - "<#5A4E7C>[<#FF7518>Event<#5A4E7C>] <#B8B0C8>กำลังรีเซ็ตสนามประลอง"

